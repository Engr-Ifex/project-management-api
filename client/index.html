    <meta name="color-scheme" content="light" />
    <!--
      An SVG favicon, and a link to it. Without a declared icon the browser
      still requests /favicon.ico on every load and logs a 404 — which is what
      the browser verification caught.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="description"
      content="PROJEX — project management for teams that plan, track and ship work together."
    />
    <meta property="og:title" content="PROJEX — Project management for teams" />
    <meta property="og:description" content="Plan, track, and ship work together in workspaces built for clarity." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="PROJEX — Project management for teams" />
    <meta name="twitter:description" content="Plan, track, and ship work together in workspaces built for clarity." />
    <title>PROJEX</title>
  </head>
