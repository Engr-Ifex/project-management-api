<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <!--
      An SVG favicon, and a link to it. Without a declared icon the browser
      still requests /favicon.ico on every load and logs a 404 — which is what
      the browser verification caught.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="description"
      content="Project management for teams that plan, track and ship work together."
    />
    <title>Project Management</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
